[package]
name = "pulse-protocol"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
description = "Lattice Network — Sealed-sender Pulse Protocol (open-core)."

[dependencies]
lattice-crypto = { path = "../lattice-crypto" }
aes-gcm = "0.10"
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
