[package]
name = "mixnet-relay"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
description = "Lattice Loopix mixnet relay — native Rust replacement of backend/mixnet_relay.py."

[[bin]]
name = "mixnet-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = { version = "3.2", default-features = false, features = ["rustls-tls", "dns-resolver", "bson-2", "compat-3-3-0"] }
bson = { version = "2.13", features = ["chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_distr = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
