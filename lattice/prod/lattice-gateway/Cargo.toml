[package]
name = "lattice-gateway"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
description = "Lattice Network — Native Rust HTTP gateway. FASE 3 spike: 12 read-only endpoints replacing the Python FastAPI hot path."

[[bin]]
name = "lattice-gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = { version = "3.2", default-features = false, features = ["rustls-tls", "dns-resolver", "bson-2", "compat-3-3-0"] }
bson = { version = "2.13", features = ["chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha3 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# FASE 3 M3 — write path
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"
once_cell = "1"
regex = "1"
rand = "0.8"
jsonwebtoken = "9"
# M6 — envelope + license
argon2 = "0.5"
aes-gcm = "0.10"
# M7 step 3 — PDF receipt
printpdf = "0.7"
# M7 step 4b — Starknet-flavoured Poseidon (cross-interop with poseidon_py)
starknet-crypto = "0.6"
starknet-ff = "0.3"
num-bigint = "0.4"
# M7 step 5 — OpenTimestamps Bitcoin anchor
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
# M8 — multipart file upload + SSE streaming
multer = "3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
totp-rs = { version = "5", features = ["otpauth"] }
