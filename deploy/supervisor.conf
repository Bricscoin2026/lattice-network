; ---------- 3 Mixnet relays (Rust native) ----------
[program:lattice_mix_1]
command=/opt/lattice/bin/mixnet-relay
directory=/opt/lattice
environment=LATTICE_RELAY_ID="MIX-01",LATTICE_RELAY_PORT="9101",LATTICE_RELAY_LAYER="1",LATTICE_MIX_MEAN_DELAY_MS="60",RUST_LOG="info"
autostart=true
autorestart=true
priority=25
stdout_logfile=/var/log/supervisor/mix_1.out.log
stderr_logfile=/var/log/supervisor/mix_1.err.log

