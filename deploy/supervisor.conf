; Lattice Network — single-container supervisor config
; ====================================================
; 1 FastAPI gateway  (port 8001, exposed)
; 4 QBFT validators  (Rust binaries, ports 9001-9004, loopback only)
; 3 Mixnet relays    (Rust binaries, ports 9101-9103, loopback only)
;
; FASE 2 (Iter 42): blockchain stack now runs on native Rust binaries.
; Wire-compatible with the previous Python implementation (same MongoDB
; schema, same ML-DSA-65 PQClean FIPS 204 signatures).

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------- FastAPI gateway (Python — fallback path for endpoints not yet ported to Rust) ----------
[program:lattice_api]
command=/usr/local/bin/uvicorn server:app --host 0.0.0.0 --port 8001 --workers 1
directory=/app/backend
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/api.out.log
stderr_logfile=/var/log/supervisor/api.err.log
stopsignal=TERM
stopwaitsecs=10

; ---------- Rust gateway (FASE 3 — 12 read-only endpoints, native binary) ----------
[program:lattice_gateway]
command=/opt/lattice/bin/lattice-gateway
directory=/opt/lattice
environment=LATTICE_GATEWAY_PORT="8002",RUST_LOG="info"
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/supervisor/gateway.out.log
stderr_logfile=/var/log/supervisor/gateway.err.log
stopsignal=TERM
stopwaitsecs=10

; ---------- 4 QBFT validators (Rust native) ----------
[program:lattice_qbft_v1]
command=/opt/lattice/bin/qbft-validator
directory=/opt/lattice
environment=LATTICE_VAL_ID="VAL-01",LATTICE_VAL_PORT="9001",RUST_LOG="info"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/qbft_v1.out.log
stderr_logfile=/var/log/supervisor/qbft_v1.err.log
stopsignal=TERM
stopwaitsecs=10

