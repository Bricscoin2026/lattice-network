# ============================================================================
#  Lattice Network · docker-compose stack (production-grade single-host)
#
#  Servizi:
#    • mongo            - MongoDB 7 con auth attiva e persistenza su volume
#    • backend          - FastAPI + bridge Rust (server.py)
#    • qbft-1..4        - 4 validator QBFT (consenso 2f+1)
#    • mixnet-1..3      - 3 relay Loopix (solo se LATTICE_COMPLIANCE_MODE=0)
#    • frontend         - Nginx + React build, TLS termination
#
#  Tutti i servizi sono restartati automaticamente, healthcheck attivi,
#  log JSON limitati a 100 MB per servizio.
# ============================================================================
version: "3.9"

x-restart: &restart
  restart: unless-stopped
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "100m", max-file: "5" }

services:
  mongo:
    image: mongo:7
    container_name: lattice-mongo
    <<: [*restart, *logging]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: lattice/backend:1.0
    container_name: lattice-backend
    <<: [*restart, *logging]
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      MONGO_URL: ${MONGO_URL}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      AT_REST_KEY: ${AT_REST_KEY}
      LATTICE_COMPLIANCE_MODE: ${LATTICE_COMPLIANCE_MODE:-1}
      LATTICE_STRICT_AUTH: ${LATTICE_STRICT_AUTH:-1}
      CORS_ORIGINS: ${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - "8002"        # FASE 3 — lattice-gateway (Rust native) for nginx upstream
    ports: ["127.0.0.1:8001:8001"]

  qbft-1: { <<: [*restart, *logging], image: lattice/qbft:1.0, container_name: lattice-qbft-1, environment: { NODE_ID: VAL-01, MONGO_URL: ${MONGO_URL}, DB_NAME: ${DB_NAME} }, depends_on: { mongo: { condition: service_healthy } } }
  qbft-2: { <<: [*restart, *logging], image: lattice/qbft:1.0, container_name: lattice-qbft-2, environment: { NODE_ID: VAL-02, MONGO_URL: ${MONGO_URL}, DB_NAME: ${DB_NAME} }, depends_on: { mongo: { condition: service_healthy } } }
  qbft-3: { <<: [*restart, *logging], image: lattice/qbft:1.0, container_name: lattice-qbft-3, environment: { NODE_ID: VAL-03, MONGO_URL: ${MONGO_URL}, DB_NAME: ${DB_NAME} }, depends_on: { mongo: { condition: service_healthy } } }
  qbft-4: { <<: [*restart, *logging], image: lattice/qbft:1.0, container_name: lattice-qbft-4, environment: { NODE_ID: VAL-04, MONGO_URL: ${MONGO_URL}, DB_NAME: ${DB_NAME} }, depends_on: { mongo: { condition: service_healthy } } }

  mixnet-1: { <<: [*restart, *logging], image: lattice/mixnet:1.0, container_name: lattice-mixnet-1, profiles: ["whistleblowing"], environment: { RELAY_ID: MIX-EU-1, MONGO_URL: ${MONGO_URL}, DB_NAME: ${DB_NAME} } }
  mixnet-2: { <<: [*restart, *logging], image: lattice/mixnet:1.0, container_name: lattice-mixnet-2, profiles: ["whistleblowing"], environment: { RELAY_ID: MIX-EU-2, MONGO_URL: ${MONGO_URL}, DB_NAME: ${DB_NAME} } }
  mixnet-3: { <<: [*restart, *logging], image: lattice/mixnet:1.0, container_name: lattice-mixnet-3, profiles: ["whistleblowing"], environment: { RELAY_ID: MIX-EU-3, MONGO_URL: ${MONGO_URL}, DB_NAME: ${DB_NAME} } }

  frontend:
    image: lattice/frontend:1.0
    container_name: lattice-frontend
    <<: [*restart, *logging]
    depends_on: { backend: { condition: service_healthy } }
    environment:
      REACT_APP_BACKEND_URL: https://${LATTICE_DOMAIN}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "80:80"

volumes:
  mongo_data:
