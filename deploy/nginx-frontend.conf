upstream lattice_rust_gateway {
    # FASE 3 — 12 read-only endpoints, native Rust binary.
    server backend:8002 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

upstream lattice_python_backend {
    # Legacy FastAPI gateway — fallback for endpoints not yet ported.
    server backend:8001 max_fails=2 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # =======================================================================
    # FASE 3 split routing
    # =======================================================================
    # The 12 paths below are served by the Rust binary `lattice-gateway`
    # (axum + mongodb native driver). Everything else under /api falls
    # through to the Python FastAPI gateway.
    #
    # Failover: if the Rust gateway is down, nginx automatically retries
    # against the Python backend via `proxy_next_upstream`.
    # =======================================================================

    location = /api/health             { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/ledger/stats       { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/ledger/blocks      { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/qbft/status        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/qbft/nodes         { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/mixnet/status      { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/certify/stats      { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/certify/recent     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/lns/active         { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/tenants/public     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/transactions       { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/explorer/stats     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }

    # FASE 3 M3 + M5 + M5B — write/auth endpoints native Rust
    location = /api/leads              { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/lns/register       { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/tenants/register   { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/auth/challenge     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/auth/verify        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }

    # FASE 3 M6 — license + envelope at-rest
    location = /api/admin/license/status   { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/license/verify   { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/secrets/status   { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/secrets/init     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/secrets/unlock   { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/secrets/lock     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/secrets/seal     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/secrets/open     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }

    # FASE 3 M7 — Certify E2E mail
    location = /api/certify/send           { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    # M7 step 2: read / restore / delete on /api/certify/{mail_id}[/...]
    location ~ ^/api/certify/[^/]+/(read|restore)$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    # M7 step 3: signed PDF receipt
    location ~ ^/api/certify/[^/]+/receipt\.pdf$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/certify/[^/]+$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }

    # FASE 3 M7 step 4 — Pulse Double-Ratchet + RLN + anchor
    location = /api/pulse/send             { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location ~ ^/api/pulse/session/[^/]+$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }

    # FASE 3 M7 step 5 — OpenTimestamps Bitcoin anchor
    location = /api/admin/ots/status        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/ots/anchor        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/ots/upgrade-all   { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location ~ ^/api/admin/ots/upgrade/[^/]+$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/admin/ots/anchors/[^/]+/proof$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }

    # FASE 3 M8 — bulk port of Python read-only endpoints (14 endpoints)
    location = /api/me                  { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/pqc/info            { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/rust/info           { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/rust/selftest       { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/tenants             { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/lns                 { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/lns/check           { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/pulse/conversations { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/pulse/messages      { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location ~ ^/api/keystore/[^/]+$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/ledger/verify/[^/]+$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/audit/public/[^/]+$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/tenants/[^/]+/(employees|stats)$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/lns/[^/]+/enc-key$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }

    # FASE 3 M8 batch 2 — admin/vendor/leads/lns mutating
    location = /api/admin/health/overview { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/vendor/tenants        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/vendor/stats          { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/leads                 { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/leads/unread-count    { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/leads/read-all        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location ~ ^/api/leads/[^/]+/read$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/leads/[^/]+$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/lns/[^/]+/role$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }

    # FASE 3 M8 batch 3 — audit / auth / alerts (10 endpoints)
    location = /api/audit/verify        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/auth/logout         { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/auth/revoke-all     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/auth/sessions       { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location ~ ^/api/auth/sessions/[^/]+/revoke$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location = /api/auth/2fa/status     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/alerts/webhooks     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/alerts/test-fire    { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }

    # FASE 3 M8 batch 4 (lite) — mixnet topology + route
    location = /api/mixnet/topology     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/mixnet/route        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }

    # FASE 3 M8 batch 4 — attachments + qbft alerts + logs SSE + license install
    location = /api/attachments/upload      { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; client_max_body_size 12m; }
    location ~ ^/api/attachments/[^/]+/meta$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }
    location ~ ^/api/attachments/[^/]+$ {
        proxy_pass http://lattice_rust_gateway;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
        proxy_buffering off;
    }
    location = /api/qbft/alerts             { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/logs/stream             { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/audit/stream            { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; proxy_buffering off; proxy_read_timeout 1h; }
    location = /api/admin/license/install   { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/license/reload    { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }

    # FASE 3 M8 final batch — 2FA + chain reset + PEC + audit export
    location = /api/auth/2fa/enroll         { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/auth/2fa/verify         { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/auth/2fa/disable        { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/admin/chain/reset       { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/certify/pec/webhook     { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }
    location = /api/audit/export            { proxy_pass http://lattice_rust_gateway; include /etc/nginx/conf.d/_lattice_proxy.inc; }

    # All other API calls → Python FastAPI gateway (legacy path).
    location /api/ {
        proxy_pass http://lattice_python_backend;
        include /etc/nginx/conf.d/_lattice_proxy.inc;
    }

    # Long cache for hashed static assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown route serves index.html (React handles routing).
    location / {
        try_files $uri /index.html;
    }

    # Security headers.
    add_header X-Frame-Options "DENY"          always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(),microphone=()" always;
}
